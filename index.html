<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Frontier — AI Model Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="progress" id="progressBar" aria-hidden="true"></div>
<div class="wrap">

  <header>
    <div class="header-top">
      <div class="brand">
        <div class="eyebrow">Live Intelligence Feed</div>
        <h1>The <em>frontier</em> model landscape</h1>
        <p class="subtitle">OpenAI · Anthropic · Google · Meta · xAI · DeepSeek · Moonshot · MiniMax · Qwen · Mistral</p>
      </div>
      <div class="header-actions">
        <button id="fetchBtn" onclick="fetchLatest()">
          <span class="btn-icon" aria-hidden="true">⟳</span>
          <span class="btn-label">Refresh</span>
        </button>
        <div class="theme-switcher" role="group" aria-label="Theme">
          <button class="theme-btn" data-theme="void"    onclick="setTheme('void')"    title="Void">Void</button>
          <button class="theme-btn" data-theme="nord"    onclick="setTheme('nord')"    title="Nord">Nord</button>
          <button class="theme-btn" data-theme="dracula" onclick="setTheme('dracula')" title="Dracula">Dracula</button>
        </div>
      </div>
    </div>
    <div class="meta-bar">
      <div class="live-dot" aria-hidden="true"></div>
      <span id="lastUpdated">Loading…</span>
      <span id="cooldownNote"></span>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat"><div class="stat-l">Models tracked</div><div class="stat-n" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-l">Released</div><div class="stat-n stat-green" id="stat-released">—</div></div>
    <div class="stat"><div class="stat-l">Upcoming</div><div class="stat-n stat-amber" id="stat-upcoming">—</div></div>
    <div class="stat"><div class="stat-l">Active labs</div><div class="stat-n" id="stat-labs">—</div></div>
  </div>

  <!-- Filters -->
  <section class="toolbar" aria-label="Filter models">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" id="searchInput" placeholder="Search models, labs, capabilities…" oninput="applyFilters()" aria-label="Search models">
      <kbd class="search-kbd">/</kbd>
    </div>
    <div class="filter-groups">
      <div class="filter-group">
        <span class="filter-group-name">Status</span>
        <div class="filter-pills" id="pills-status">
          <button class="pill active" data-group="status" data-val="all" onclick="setPill(this)">All</button>
          <button class="pill" data-group="status" data-val="released" onclick="setPill(this)">Released</button>
          <button class="pill" data-group="status" data-val="upcoming" onclick="setPill(this)">Upcoming</button>
          <button class="pill" data-group="status" data-val="imminent" onclick="setPill(this)">Imminent</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-group-name">Lab</span>
        <div class="filter-pills" id="pills-lab">
          <button class="pill active" data-group="lab" data-val="all" onclick="setPill(this)">All</button>
          <button class="pill" data-group="lab" data-val="anthropic" onclick="setPill(this)">Anthropic</button>
          <button class="pill" data-group="lab" data-val="openai" onclick="setPill(this)">OpenAI</button>
          <button class="pill" data-group="lab" data-val="google" onclick="setPill(this)">Google</button>
          <button class="pill" data-group="lab" data-val="meta" onclick="setPill(this)">Meta</button>
          <button class="pill" data-group="lab" data-val="xai" onclick="setPill(this)">xAI</button>
          <button class="pill" data-group="lab" data-val="deepseek" onclick="setPill(this)">DeepSeek</button>
          <button class="pill" data-group="lab" data-val="moonshot" onclick="setPill(this)">Moonshot</button>
          <button class="pill" data-group="lab" data-val="minimax" onclick="setPill(this)">MiniMax</button>
          <button class="pill" data-group="lab" data-val="qwen" onclick="setPill(this)">Qwen</button>
          <button class="pill" data-group="lab" data-val="mistral" onclick="setPill(this)">Mistral</button>
          <button class="pill" data-group="lab" data-val="other" onclick="setPill(this)">Other</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-group-name">Capability</span>
        <div class="filter-pills" id="pills-cap">
          <button class="pill active" data-group="cap" data-val="all" onclick="setPill(this)">All</button>
          <button class="pill" data-group="cap" data-val="coding" onclick="setPill(this)">Coding</button>
          <button class="pill" data-group="cap" data-val="reasoning" onclick="setPill(this)">Reasoning</button>
          <button class="pill" data-group="cap" data-val="multimodal" onclick="setPill(this)">Multimodal</button>
          <button class="pill" data-group="cap" data-val="agents" onclick="setPill(this)">Agents</button>
          <button class="pill" data-group="cap" data-val="open" onclick="setPill(this)">Open Source</button>
          <button class="pill" data-group="cap" data-val="video" onclick="setPill(this)">Video</button>
          <button class="pill" data-group="cap" data-val="speed" onclick="setPill(this)">Speed</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Results count -->
  <div class="results-bar">
    <span id="resultsCount" aria-live="polite">—</span>
    <button id="clearFilters" onclick="clearAllFilters()" hidden>✕ Clear filters</button>
  </div>

  <!-- Models list -->
  <main id="modelsList"></main>

  <!-- Empty state -->
  <div id="emptyState" hidden>
    <div class="empty-icon" aria-hidden="true">⊘</div>
    <div>No models match your filters.</div>
    <button class="link-btn" onclick="clearAllFilters()">Clear filters</button>
  </div>

  <footer>
    <span id="footerProvider">AI Model Tracker</span>
    <span id="footerTimestamp">—</span>
  </footer>

</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
